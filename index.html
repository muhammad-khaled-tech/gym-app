<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="خطة تنشيف وبناء عضل بالأكل المصري">
  <title>خطتي</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <span class="logo">💪 خطتي</span>
  </header>
  <div id="banner" class="banner" hidden>مش قادر أحفظ البيانات على الموبايل. اعمل نسخة احتياطية من الإعدادات.</div>
  <main id="view" class="view"><p class="muted center">بيحمّل…</p></main>
  <nav id="nav" class="nav" hidden>
    <button data-act="tab" data-tab="today"><span>🏠</span>النهارده</button>
    <button data-act="tab" data-tab="meals"><span>🍽</span>الأكل</button>
    <button data-act="tab" data-tab="workout"><span>🏋️</span>التمرين</button>
    <button data-act="tab" data-tab="progress"><span>📈</span>التقدم</button>
    <button data-act="tab" data-tab="settings"><span>⚙️</span>الإعدادات</button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
